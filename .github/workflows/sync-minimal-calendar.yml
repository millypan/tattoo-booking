name: Sync minimal calendar

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Notion bookings
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            https://tattoo-booking-phi.vercel.app/api/sync/minimal
